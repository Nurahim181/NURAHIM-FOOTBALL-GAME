<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURAHIM FOOTBALL</title>

<style>
body {
    background: #071b35;
    color: white;
    text-align: center;
    font-family: Arial;
}

h1 {
    color: gold;
    font-size: 30px;
}

.player {
    margin: 20px auto;
}

.player img {
    width: 180px;
    height: 220px;
    object-fit: cover;
    object-position: top;
    border: 4px solid gold;
    border-radius: 20px;
}

.field {
    background: repeating-linear-gradient(
        #188342 0px,
        #188342 60px,
        #126b35 60px,
        #126b35 120px
    );
    border: 4px solid white;
    border-radius: 15px;
    height: 300px;
    max-width: 550px;
    margin: auto;
    position: relative;
}

.goal {
    font-size: 65px;
    margin-top: 20px;
}

.ball {
    font-size: 40px;
    margin-top: 30px;
}

button {
    background: gold;
    color: black;
    border: none;
    padding: 15px;
    margin: 8px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}

#result {
    color: gold;
    font-size: 24px;
}
</style>
</head>

<body>

<h1>⚽ NURAHIM FOOTBALL GAME</h1>

<div class="player">
    <img src="IMG_1867(1).jpeg" alt="Нурахим">
    <h2>NURAHIM #7</h2>
</div>

<h2>Упай: <span id="score">0</span></h2>

<div class="field">
    <div class="goal">🥅</div>
    <div class="ball" id="ball">⚽</div>
    <h2>🧤</h2>
</div>

<h2>Гол киргиз!</h2>

<button onclick="kick()">⚽ ТЕПКИЛЕ!</button>

<div id="result">Оюн башталды!</div>

<script>
let score = 0;

function kick() {
    let ball = document.getElementById("ball");
    let result = document.getElementById("result");

    ball.style.transform = "translateY(-100px)";

    if (Math.random() > 0.3) {
        score += 10;
        document.getElementById("score").innerText = score;
        result.innerText = "🔥 ГОООООЛ!";
    } else {
        result.innerText = "🧤 Дарбазачы тосту!";
    }

    setTimeout(() => {
        ball.style.transform = "translateY(0)";
    }, 500);
}
</script>

</body>
</html>
